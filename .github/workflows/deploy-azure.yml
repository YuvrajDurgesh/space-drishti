name: Deploy to Azure VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Code ko fresh 'space-drishti-new' folder me copy karein
      - name: Copy code to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "."
          target: "/home/mr.yuvraj99/space-drishti-new"

      # 2. Build banana aur safely folders swap karna
      - name: Build and restart on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 30m
          script: |
            # .env.local file generate karna
            cat > /home/mr.yuvraj99/space-drishti-new/.env.local << 'EOF'
            SPACETRACK_USER=${{ secrets.SPACETRACK_USER }}
            SPACETRACK_PASS=${{ secrets.SPACETRACK_PASS }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
            EOF

            # Naye folder me ghusein
            cd /home/mr.yuvraj99/space-drishti-new

            echo "--- 📦 Installing dependencies ---"
            npm ci

            echo "--- 🏗️ Building Production Application (CRITICAL STEP) ---"
            # Build yahan chalega taaki folder swap hone se pehle .next directory taiyar ho jaye
            npm run build

            echo "--- 🔄 Swapping Old Code with New Code ---"
            # Purane old backup ko delete karein
            rm -rf /home/mr.yuvraj99/space-drishti-old
            
            # Current chal rahe folder ko old bana dein
            mv /home/mr.yuvraj99/space-drishti /home/mr.yuvraj99/space-drishti-old 2>/dev/null || true
            
            # Naye built folder ko main live folder bana dein
            mv /home/mr.yuvraj99/space-drishti-new /home/mr.yuvraj99/space-drishti

            echo "--- 🚀 Restarting PM2 Server ---"
            cd /home/mr.yuvraj99/space-drishti
            
            # Purane PM2 process ko delete karke fresh context ke sath run karna (Host flag fix ke sath)
            pm2 delete space-drishti 2>/dev/null || true
            pm2 start npm --name "space-drishti" -- exec "next start -p 3000 -H 127.0.0.1"
            
            pm2 save
            echo "--- 🎉 Done! Deployment Successful ---"