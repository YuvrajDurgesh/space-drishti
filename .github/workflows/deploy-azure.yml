name: Deploy Space Drishti to Azure VM

on:
  push:
    branches:
      - main  # Jab bhi aap main branch pe push/merge karenge, ye trigger hoga
  workflow_dispatch: # Taaki GitHub Actions UI se manual bhi click karke deploy kar sakein

jobs:
  deploy:
    name: Production Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH into Azure VM and Execution
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          timeout: 20m
          command_timeout: 20m   # ← YEH ADD KARO
          debug: true             # ← YEH ADD KARO temporarily
          script: |
            echo "Connected!"

      - name: SSH into Azure VM and Execution
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          port: 22
          timeout: 20
          script: |
            echo "--- 🚀 Deployment Started ---"

            cd /var/www/space-drishti || exit 1

            echo "--- 🧹 Cleaning stuck builds ---"
            # pkill bilkul nahi — sirf .next/cache clean karo
            rm -rf .next

            echo "--- 🔄 Pulling latest changes ---"
            git reset --hard HEAD
            git pull origin main

            echo "--- 📦 Installing dependencies ---"
            npm ci

            echo "--- 🏗️ Building ---"
            npm run build > /tmp/build.log 2>&1
            BUILD_EXIT=$?

            if [ $BUILD_EXIT -ne 0 ]; then
            echo "--- ❌ Build Failed ---"
            tail -50 /tmp/build.log
            exit 1
            fi

            echo "--- 🔄 Reloading PM2 ---"
            pm2 reload space-drishti || pm2 start npm --name "space-drishti" -- start
            pm2 save

            echo "--- 🎉 Done! ---"